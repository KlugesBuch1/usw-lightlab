[package]
name = "lightlab"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rfd = "0.15"
russh = { version = "0.65.4", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
